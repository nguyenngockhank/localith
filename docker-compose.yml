# Localith + Ollama + ChromaDB in one stack.
#
#   docker compose up -d --build
#   docker compose run --rm app npm run scan -- https://example.com --knowledge
#   open http://localhost:3000/ui
#
# Model names are read from .env when it exists (OLLAMA_MODEL, OLLAMA_EMBED_MODEL).

services:
  app:
    build: .
    ports:
      # Local only: the API has no authentication.
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "3000"
      OLLAMA_URL: http://ollama:11434
      CHROMA_URL: http://chroma:8000
    volumes:
      - ./reports:/app/reports
    depends_on:
      - ollama
      - chroma

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-data:/root/.ollama

  # One-shot job: waits for Ollama, downloads the models, then exits.
  ollama-pull:
    image: ollama/ollama
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        ollama pull ${OLLAMA_MODEL:-qwen3:4b} &&
        ollama pull ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    restart: "no"

  chroma:
    image: chromadb/chroma
    volumes:
      - chroma-data:/data

volumes:
  ollama-data:
  chroma-data:
